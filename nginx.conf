# Load balancer in front of the API replicas.
#
# docker-compose publishes this container on host port 8000, so every URL in
# the README (http://localhost:8000/docs) keeps working while one, two or three
# "api" containers sit behind it.
#
# `server api:8000 resolve` + the resolver line: the name "api" is looked up in
# Docker's embedded DNS again and again, so `docker compose up --scale api=3`
# is picked up without restarting this container. Needs nginx >= 1.27.3.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Bulk audio uploads: FastAPI accepts several clips per request.
    client_max_body_size 50m;

    # Default round robin across whatever "api" currently resolves to.
    upstream spoken_digit_api {
        zone api_upstream 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS
        server api:8000 resolve;
        keepalive 32;                              # reuse upstream connections
    }

    server {
        listen 80;
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Used by the container healthcheck: proves nginx itself is serving,
        # without depending on the API being ready.
        location = /lb-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://spoken_digit_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 5s;
            # /retrain starts a background job and answers immediately, but a
            # cold model load can still take a few seconds.
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
